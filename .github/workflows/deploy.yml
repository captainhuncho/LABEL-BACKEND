# On every push to main: test, build, and upload dist/ to ops.imssrecords.com over FTPS.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Public values (they ship in the browser bundle anyway).
          VITE_SUPABASE_URL: https://cdyjxhtmsugxemfcllhh.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_e7dm1rjM8ea9CY8iH4AnzA_TEB6JcBk
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          # The FTP account's home folder is the ops.imssrecords.com folder.
          server-dir: ./
