# Checks every push and pull request: tests, production build, and npm audit of
# what ships (no high or critical). Needs no secrets.
name: ci
on:
  push: {}
  pull_request: {}
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
